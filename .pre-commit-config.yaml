exclude: '^$'
fail_fast: false
repos:

-   repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-docstring-first
    -   id: check-json
    -   id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        exclude: '^helm/stac-fastapi-eodag/templates/.*$'
    -   id: check-xml
    -   id: check-added-large-files
        args: ['--maxkb=1600']
    -   id: debug-statements
    -   id: check-merge-conflict

- repo: local
  hooks:
    - id: helm-docs-container
      name: helm-docs-container
      language: system
      pass_filenames: false
      entry: bash -c 'docker run --rm --volume "$PWD:/helm-docs" -u "$(id -u)" docker.io/jnorwood/helm-docs:latest --chart-search-root=helm'

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.12
  hooks:
    # Run the linter.
    - id: ruff
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
